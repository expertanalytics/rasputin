name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A push to a PR branch supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The C++ core builds and tests without Python in the loop. Keeping it a
  # separate job is the CI expression of the I/O boundary: if this job ever
  # needs a Python package to pass, the core has grown a dependency it should
  # not have.
  cpp:
    name: C++ core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # test_point, test_raster, test_solar_position.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Editable, so the compiled extension is built from this checkout rather
      # than resolved from an index.
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest

      # Static gates, per CLAUDE.md section 4. Run on 3.11 only: mypy and ruff
      # are configured for a single target version, so repeating them across
      # the matrix reports the same findings three times.
      - name: mypy (strict)
        if: matrix.python-version == '3.11'
        run: mypy

      - name: ruff
        if: matrix.python-version == '3.11'
        run: ruff check .
