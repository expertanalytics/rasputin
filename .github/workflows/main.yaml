name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A push to a PR branch supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The C++ core builds and tests without Python in the loop. Keeping it a
  # separate job is the CI expression of the I/O boundary: if this job ever
  # needs a Python package to pass, the core has grown a dependency it should
  # not have.
  cpp:
    name: C++ core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The Release jobs above prove the suite passes; this one proves it passes for
  # the right reasons. A read one element past a raster buffer returns whatever
  # is adjacent and the assertion still succeeds -- that is precisely the legacy
  # defect pinned by the far-corner regression in tests/cpp/test_raster.cpp, and
  # an uninstrumented build cannot see it. The sampling path computes indices
  # from floating-point coordinates and then reads index, index+1, index+cols
  # and index+cols+1, which is the shape ASan exists for. Worth having in place
  # before the CDT lands, since predicate and flip code does far more pointer
  # arithmetic over vertex and edge arrays than anything here today.
  sanitizers:
    name: C++ sanitizers (asan+ubsan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -fno-sanitize-recover=all is load-bearing, not belt-and-braces: UBSan's
      # default is to print the diagnostic and keep going, so the process exits
      # 0 and the job passes green on undefined behaviour. Without this flag the
      # ubsan half of this job reports findings nobody is forced to read.
      - name: Configure
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build build-san --parallel

      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  # Increment 14, R7: refinement is the first code path that starts threads,
  # and asan+ubsan cannot see a data race. TSan cannot share a build with ASan,
  # so this is its own job, building only the four refinement suites. T6 runs
  # the loop at 1, 2, 7 and all threads; a clean run is the independent check
  # of the design's "no shared writes" claim. The binaries are run directly
  # because ctest names the tests by Catch case, not by target.
  tsan:
    name: C++ thread sanitizer (refinement)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The runner's kernel randomises mmap with more bits than TSan's shadow
      # layout tolerates, which aborts every binary at start-up with
      # "unexpected memory mapping". 28 bits is the value TSan supports.
      - name: Allow TSan's memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g"

      - name: Build
        run: >
          cmake --build build-tsan --parallel --target
          test_refinement_chunks test_mesh_lattice_split
          test_refinement_scan prop_refinement_refine test_mesh_lawson
          test_refinement_scan_offnode test_refinement_refine
          test_mesh_row_spans prop_refinement_scan_equivalence
          test_mesh_quality prop_refinement_quality

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          for suite in test_refinement_chunks test_mesh_lattice_split \
                       test_refinement_scan prop_refinement_refine test_mesh_lawson \
                       test_refinement_scan_offnode test_refinement_refine \
                       test_mesh_row_spans prop_refinement_scan_equivalence \
                       test_mesh_quality prop_refinement_quality; do
            build-tsan/tests/cpp/$suite
          done

  # Rules that previously existed only as prose in CLAUDE.md and were enforced
  # by nothing. All three scripts are dependency-free and parse rather than execute,
  # so this job needs no install step.
  governance:
    name: Governance gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CLAUDE.md section 2. The constraint the whole project is organised
      # around, checked against imports and declared dependencies rather than
      # prose -- the docs name GDAL precisely to explain its exclusion.
      - name: No prohibited dependencies
        run: python tools/check_prohibited_deps.py

      # legacy/ is the porting reference but is excluded from ruff, mypy and
      # pytest, so nothing else reads it. An archive that silently rots is
      # worse than no archive.
      - name: Archive integrity
        run: python tools/check_legacy_imports.py

      # The vendored detria header must stay inside its backend TUs -- one per
      # backend, none in any header. CMake already makes that structural
      # (lib/detria is PRIVATE on terrain_predicates and terrain_cdt), but a
      # build edit can dissolve a structural guard, and the swappability of both
      # backends rests on this rule.
      - name: detria boundary
        run: python tools/check_detria_boundary.py

      # Only the decidable half: a cited file exists and is long enough. The
      # half that matters -- whether the quotation at that line still says what
      # the citing prose claims -- is @reviewer's, per
      # .claude/REQUIRED-READING.md. CI's shallow checkout has no master to diff
      # against, so the at-risk worklist is empty here by design; run it locally.
      - name: Citations resolve
        run: python tools/check_citations.py

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Editable, so the compiled extension is built from this checkout rather
      # than resolved from an index.
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest

      # The GeoTIFF suites branch on the `codecs` extra: some tests need
      # imagecodecs (LZW, the real Kartverket DEM), others test its absence.
      # No single environment runs both halves, so the step above covers the
      # absent half and this one installs the extra and re-runs both files.
      - name: Tests with the codecs extra
        run: |
          python -m pip install -e ".[dev,codecs]"
          pytest --no-cov tests/python/test_io_geotiff.py tests/python/test_geotiff_fixtures.py

      # Increment 13, ruling 10: read the .vtk output back with the readers
      # ParaView uses. The suite skips when vtk is absent, so it is run only
      # here, after the install -- a leg whose wheel disappears fails in the
      # install, not in a silent skip. Increment 12's real-DEM test needs both
      # extras (LZW to decode, vtk to read back), so it runs here too.
      - name: Tests with the viewer extra
        run: |
          python -m pip install -e ".[dev,codecs,viewer]"
          pytest --no-cov tests/python/test_io_vtk_readback.py tests/python/test_cli_mesh_dem.py

      # Static gates, per CLAUDE.md section 4. Run on the floor leg only:
      # mypy and ruff are configured for a single target version, so repeating
      # them across the matrix reports the same findings once per leg. The leg
      # must be the floor, because that is the version the two tools are
      # configured for -- checking floor semantics on a newer leg means the
      # installed stubs are newer than the target, which is what made this gate
      # fail on a 3.14 venv while the floor was 3.11.
      - name: mypy (strict)
        if: matrix.python-version == '3.12'
        run: mypy

      - name: ruff
        if: matrix.python-version == '3.12'
        run: ruff check .
