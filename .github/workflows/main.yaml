name: CI

# No `push` trigger: the merge queue tests the commit that lands, so a run on
# master after the merge repeats it (h11). A hand-started run is a full run.
on:
  pull_request:
    branches: [ master ]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A push to a PR branch supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # h11: decides whether this change needs the code jobs. Prose-only changes
  # (as tools/ci_changes.py decides) skip them; governance always runs. Any
  # doubt (no base, a git failure) gives code=true, a full run. The full history
  # is fetched because the base commit must be in the clone.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: classify
        run: >
          python3 tools/ci_changes.py
          "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          "${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # The C++ core builds and tests without Python in the loop. Keeping it a
  # separate job is the CI expression of the I/O boundary: if this job ever
  # needs a Python package to pass, the core has grown a dependency it should
  # not have.
  cpp:
    name: C++ core (${{ matrix.os }}${{ matrix.hardening == 'OFF' && ', unchecked' || '' }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code != 'false'
    # The unchecked leg does not block a merge (h11 §9, ruling 1).
    continue-on-error: ${{ matrix.hardening == 'OFF' }}
    # A hang (a non-terminating refinement loop under a bug) must fail the
    # job, not hold the runner for GitHub's 6-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        hardening: ["ON"]
        # Increment 24: the unchecked build a heavy run uses
        # (RASPUTIN_HARDENING=OFF) is one nobody else compiles. This leg keeps
        # it compiling and runs the guard's OFF half (T1 compiles against
        # "none", T2 is skipped). The two legs above build the default, ON.
        include:
          - os: ubuntu-latest
            hardening: "OFF"

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRASPUTIN_HARDENING=${{ matrix.hardening }}

      - name: Build
        # One job per CPU. A bare --parallel is an unlimited make -j, which
        # pages the 7 GB macOS runner (h13). Same on every build line below.
        run: cmake --build build --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The Release jobs above prove the suite passes; this one proves it passes for
  # the right reasons. A read one element past a raster buffer returns whatever
  # is adjacent and the assertion still succeeds -- that is precisely the legacy
  # defect pinned by the far-corner regression in tests/cpp/test_raster.cpp, and
  # an uninstrumented build cannot see it. The sampling path computes indices
  # from floating-point coordinates and then reads index, index+1, index+cols
  # and index+cols+1, which is the shape ASan exists for. Worth having in place
  # before the CDT lands, since predicate and flip code does far more pointer
  # arithmetic over vertex and edge arrays than anything here today.
  sanitizers:
    name: C++ sanitizers (asan+ubsan)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code != 'false'
    # A hang (a non-terminating refinement loop under a bug) must fail the
    # job, not hold the runner for GitHub's 6-hour default.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # -fno-sanitize-recover=all is load-bearing, not belt-and-braces: UBSan's
      # default is to print the diagnostic and keep going, so the process exits
      # 0 and the job passes green on undefined behaviour. Without this flag the
      # ubsan half of this job reports findings nobody is forced to read.
      - name: Configure
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build build-san --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Test
        # One test per CPU. Every Catch2 case is its own process and none
        # shares a file or other state (h14 §2d).
        run: ctest --test-dir build-san --output-on-failure --parallel "$(getconf _NPROCESSORS_ONLN)"

  # Increment 14, R7: refinement is the first code path that starts threads,
  # and asan+ubsan cannot see a data race. TSan cannot share a build with ASan,
  # so this is its own job, building only the suites listed below (refinement and
  # the parallel helpers they use). T6 runs
  # the loop at 1, 2, 7 and all threads; a clean run is the independent check
  # of the design's "no shared writes" claim. The binaries are run directly
  # because ctest names the tests by Catch case, not by target.
  tsan:
    name: C++ thread sanitizer (refinement)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code != 'false'
    # A hang (a non-terminating refinement loop under a bug) must fail the
    # job, not hold the runner for GitHub's 6-hour default.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The runner's kernel randomises mmap with more bits than TSan's shadow
      # layout tolerates, which aborts every binary at start-up with
      # "unexpected memory mapping". 28 bits is the value TSan supports.
      - name: Allow TSan's memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g"

      - name: Build
        run: >
          cmake --build build-tsan --parallel "$(getconf _NPROCESSORS_ONLN)" --target
          test_refinement_chunks test_mesh_lattice_split
          test_refinement_scan prop_refinement_refine test_mesh_lawson
          test_refinement_scan_offnode test_refinement_refine
          test_mesh_row_spans prop_refinement_scan_equivalence
          test_mesh_quality prop_refinement_quality
          test_refinement_constraint_feet
          test_refinement_chunks_dynamic test_refinement_active test_mesh_lawson_stack
          test_refinement_refine_points prop_refinement_refine_points
          prop_refinement_edge_strip prop_refinement_frozen prop_refinement_seam

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          for suite in test_refinement_chunks test_mesh_lattice_split \
                       test_refinement_scan prop_refinement_refine test_mesh_lawson \
                       test_refinement_scan_offnode test_refinement_refine \
                       test_mesh_row_spans prop_refinement_scan_equivalence \
                       test_mesh_quality prop_refinement_quality \
                       test_refinement_constraint_feet \
                       test_refinement_chunks_dynamic test_refinement_active \
                       test_mesh_lawson_stack test_refinement_refine_points \
                       prop_refinement_refine_points prop_refinement_edge_strip \
                       prop_refinement_frozen prop_refinement_seam; do
            build-tsan/tests/cpp/$suite
          done

  # Rules that previously existed only as prose in CLAUDE.md and were enforced
  # by nothing. All three scripts are dependency-free and parse rather than execute,
  # so this job needs no install step.
  governance:
    name: Governance gates
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 brings the full history and the tags. check_citations.py
      # resolves `legacy/` citations against the annotated tag legacy-archive
      # (release-hygiene.md section 3); a shallow checkout has no tags, so the
      # step below would report every legacy citation as unresolvable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CLAUDE.md section 2. The constraint the whole project is organised
      # around, checked against imports and declared dependencies rather than
      # prose -- the docs name GDAL precisely to explain its exclusion.
      - name: No prohibited dependencies
        run: python tools/check_prohibited_deps.py

      # The vendored detria header must stay inside its backend TUs -- one per
      # backend, none in any header. CMake already makes that structural
      # (lib/detria is PRIVATE on terrain_predicates and terrain_cdt), but a
      # build edit can dissolve a structural guard, and the swappability of both
      # backends rests on this rule.
      - name: detria boundary
        run: python tools/check_detria_boundary.py

      # Only the decidable half is a failure: a cited file exists and is long
      # enough (for `legacy/` paths, in the legacy-archive tag the full checkout
      # above brings). The half that matters -- whether the quotation at that
      # line still says what the citing prose claims -- is @reviewer's, per
      # .claude/REQUIRED-READING.md; the tool prints it as an at-risk worklist,
      # which does not fail the build.
      - name: Citations resolve
        run: python tools/check_citations.py

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      # The full history: test_count_loc.py recounts two recorded PRs from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Editable, so the compiled extension is built from this checkout rather
      # than resolved from an index.
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Tests
        run: pytest

  # h15 §5 P: the steps that ran after the main suite, in their own job per
  # version, so they run beside it instead of after it. Same installs, same
  # order, each step's text unchanged; only the main suite's pytest is gone.
  python-extras:
    name: Python ${{ matrix.python-version }}, extras
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code != 'false'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      # Increment 24, T6: an unchecked install (-C
      # cmake.define.RASPUTIN_HARDENING=OFF) must not leave its OFF in the shared
      # build/{wheel_tag} for the next default install, and the command-line
      # setting must override pyproject.toml's. Two real non-editable installs
      # into one throwaway venv without build isolation (with isolation,
      # scikit-build-core clears the cache and the trap never occurs), so one
      # leg only, the floor.
      - name: Hardening install trap
        if: matrix.python-version == '3.12'
        run: RASPUTIN_INSTALL_TRAP=1 pytest --no-cov tests/python/test_hardening.py -k trap

      # Suites that branch on the `codecs` extra: some tests need imagecodecs
      # (LZW, the real Kartverket DEM and DTM10 extracts), others test its
      # absence. No single environment runs both halves, so the main suite
      # (the python job) covers the absent half and this one installs the extra
      # and re-runs the codecs-gated suites: the GeoTIFF ones, and the CLI and
      # golden suites that mesh the real tile (test_cli_mesh_dem.py runs in the viewer step below).
      - name: Tests with the codecs extra
        run: |
          python -m pip install -e ".[dev,codecs]"
          pytest --no-cov tests/python/test_io_geotiff.py tests/python/test_geotiff_fixtures.py \
            tests/python/test_io_read_meta.py tests/python/test_cli_mesh_mosaic.py \
            tests/python/test_cli_mesh_domain_crs.py tests/python/test_cli_mesh_domain.py \
            tests/python/test_refine_golden.py tests/python/test_cli_constraint_feet.py \
            tests/python/test_cli_mesh_refine.py tests/python/test_cli_start_quality.py

      # Increment 13, ruling 10: read the .vtk output back with the readers
      # ParaView uses. The suite skips when vtk is absent, so it is run only
      # here, after the install -- a leg whose wheel disappears fails in the
      # install, not in a silent skip. Increment 12's real-DEM test needs both
      # extras (LZW to decode, vtk to read back), so it runs here too.
      - name: Tests with the viewer extra
        run: |
          python -m pip install -e ".[dev,codecs,viewer]"
          pytest --no-cov tests/python/test_io_vtk_readback.py tests/python/test_cli_mesh_dem.py

      # Static gates, per CLAUDE.md section 4. Run on the floor leg only:
      # mypy and ruff are configured for a single target version, so repeating
      # them across the matrix reports the same findings once per leg. The leg
      # must be the floor, because that is the version the two tools are
      # configured for -- checking floor semantics on a newer leg means the
      # installed stubs are newer than the target, which is what made this gate
      # fail on a 3.14 venv while the floor was 3.11.
      - name: mypy (strict)
        if: matrix.python-version == '3.12'
        run: mypy

      - name: ruff
        if: matrix.python-version == '3.12'
        run: ruff check .

      # Layout is enforced, not advised. `# fmt: skip` and `# fmt: off` are
      # allowed with a reason (CLAUDE.md section 2); docs/ and .claude/ are
      # excluded in pyproject.toml.
      - name: ruff format
        if: matrix.python-version == '3.12'
        run: ruff format --check .

  # h11: the one required check. It runs even when a needed job failed (a
  # skipped job would report success). `changes` and governance must succeed;
  # the others must succeed, or be skipped when the change is prose only. TSan
  # is left out on purpose: it does not block a merge (h11 §9, ruling 1).
  result:
    name: CI result
    if: always()
    needs: [changes, cpp, sanitizers, governance, python, python-extras]
    runs-on: ubuntu-latest
    steps:
      - name: Every gating job passed, or was skipped on a prose-only change
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          OTHERS: ${{ needs.cpp.result }} ${{ needs.sanitizers.result }} ${{ needs.python.result }} ${{ needs.python-extras.result }}
        run: |
          fail=0
          if [ "$CHANGES" != success ]; then echo "Changed files ended: $CHANGES"; fail=1; fi
          if [ "$GOVERNANCE" != success ]; then echo "Governance gates ended: $GOVERNANCE"; fail=1; fi
          allowed=" success "
          if [ "$CODE" = false ]; then allowed=" success skipped "; fi
          set -- $OTHERS
          for job in "C++ core" "C++ sanitizers" "Python" "Python extras"; do
            case "$allowed" in
              *" ${1:-none} "*) ;;
              *) echo "$job ended: ${1:-none} (code=$CODE)"; fail=1 ;;
            esac
            shift || true
          done
          exit "$fail"
