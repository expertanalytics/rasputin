# The quick check's fixed cases (docs/increments/perf-quick-check.md, section 3),
# run in this order. args is the `mesh` argv without --out and --binary, which
# tools/bench_quick.py adds; $TREE is the tree measured, $RASPUTIN_DATA the data
# folder (default ../rasputin_data). threads 0 is the CLI's default.

[[case]]
name = "tile"
threads = [0, 1]
runs = 5
warmup = 0
args = ["mesh", "--dem", "$TREE/tests/fixtures/dem_archive/7908_3_10m_z33.tif", "--tolerance", "1"]
inputs = ["$TREE/tests/fixtures/dem_archive/7908_3_10m_z33.tif"]

[[case]]
name = "quarter"
threads = [0]
runs = 5
warmup = 0
args = ["mesh", "--dem", "$TREE/tests/fixtures/dem_archive/7908_3_10m_z33.tif",
        "--domain", "$TREE/docs/benchmarks/2026-09-26/quarter.geojson", "--tolerance", "1"]
inputs = ["$TREE/tests/fixtures/dem_archive/7908_3_10m_z33.tif",
          "$TREE/docs/benchmarks/2026-09-26/quarter.geojson"]

[[case]]
name = "numedalslagen"
threads = [0]
runs = 3
warmup = 1
args = ["mesh", "--dem", "$RASPUTIN_DATA/DTM10_UTM33_20260925",
        "--domain", "$RASPUTIN_DATA/numedalslagen_outline_nve.geojson",
        "--features", "$RASPUTIN_DATA/corine2018_dtm10_utm33.gpkg", "--features-layer", "corine2018",
        "--features-map", "corine", "--tolerance", "10"]
inputs = ["$RASPUTIN_DATA/DTM10_UTM33_20260925", "$RASPUTIN_DATA/numedalslagen_outline_nve.geojson",
          "$RASPUTIN_DATA/corine2018_dtm10_utm33.gpkg"]

[[case]]
name = "lagan"
threads = [0]
runs = 3
warmup = 1
args = ["mesh", "--dem", "glo30", "--cache", "$RASPUTIN_DATA/sweden_glo30_cache",
        "--out-crs", "EPSG:3006",
        "--domain", "$RASPUTIN_DATA/sweden_smhi_svar/lagan_mouth_svar2022_3006.geojson",
        "--features", "$RASPUTIN_DATA/corine_sql/u2018_clc2018_v2020_20u1_geoPackage/DATA/U2018_CLC2018_V2020_20u1.gpkg",
        "--features-layer", "U2018_CLC2018_V2020_20u1", "--features-crs", "EPSG:3035",
        "--features-map", "corine", "--tolerance", "10"]
inputs = ["$RASPUTIN_DATA/sweden_glo30_cache",
          "$RASPUTIN_DATA/sweden_smhi_svar/lagan_mouth_svar2022_3006.geojson",
          "$RASPUTIN_DATA/corine_sql/u2018_clc2018_v2020_20u1_geoPackage/DATA/U2018_CLC2018_V2020_20u1.gpkg"]
