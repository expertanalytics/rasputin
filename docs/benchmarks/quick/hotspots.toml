# Ruled hotspots (docs/increments/perf-quick-check.md, section 5): one
# [[hotspot]] per ruling, with case, phase (the --stats row name), share
# (percent of the case's total), date and Ola's ruling word for word. The quick
# check raises a ruled hotspot again once it has grown 10 points or more.

# Measured by @perf: 6.89 s of 16.97 s, docs/benchmarks/2026-10-07/30d-buffer/built.md.
[[hotspot]]
case = "lagan"
phase = "features clip"
share = 40.7
date = "2026-10-07"
ruling = """Asked: "The clip hotspot: features clip is now 41 % of Lagan's run. Record it as expected for now." Ola: "4: yes\""""

# Measured by @perf: features clip 6.000 s of 8.829 s (head, medians of 3, AC),
# docs/benchmarks/2026-10-11/cleanup-speed/README.md; the profile behind it is
# docs/benchmarks/2026-10-11/cleanup-profile/README.md (its three largest
# sub-steps are 80 % of the step: the outline rule 41 %, mostly GEOS union_all
# and make_valid; the two clips 21 %; coverage_clean 18 %).
# The fix Ola named is the cached repaired extract per area of interest (his
# private ideas file, "Repair CORINE once per area of interest").
[[hotspot]]
case = "numedalslagen"
phase = "features clip"
share = 68.0
date = "2026-10-12"
ruling = """Asked: "For the hotspots file, my proposal is to rule it expected at the current 6 s and let the cached-extract idea be the fix when you pick it." Ola: "Rule it expected at 6 s, cached extract is the fix\""""
