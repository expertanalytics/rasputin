[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "rasputin"
version = "0.2.0.dev0"
description = "Parallel TIN engine for terrain meshing — CGAL-free, GDAL-free, pure C++20 core with async Python bindings."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Ola Skavhaug", email = "ola@xal.no" }]
keywords = ["tin", "terrain", "mesh", "cdt", "geospatial", "computational-geometry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# Runtime deps — strict zero-GDAL / zero-CGAL policy.
# Rasterio is deliberately omitted: it wraps GDAL. GeoTIFF decoding is Python's
# and uses tifffile (pure Python, BSD-3, numpy-only, no GDAL adjacency); see the
# `raster` section of project_structure.md for the ruling and the boundary
# contract. tifffile is a hard dependency, not an extra: GeoTIFF is the
# pipeline's primary input, and a CLI that installs and then fails on its main
# input format is a packaging defect.
dependencies = [
    "pydantic>=2.6",
    "shapely>=2.0",
    "pyproj>=3.6",
    "typer>=0.12",
    "numpy>=1.26",
    "tifffile>=2024.1",
]

[project.optional-dependencies]
# Without imagecodecs (BSD-3, prebuilt wheels, also not GDAL), tifffile reads
# uncompressed and Deflate plus whatever its built-in decoders cover, which
# depends on the tifffile and Python versions. LZW -- the Kartverket fixture --
# and the floating-point predictor (317 = 3, which GDAL writes for float DEMs)
# need this extra. To check any other scheme against the installed tifffile:
#   python -c "import tifffile; print(5 in tifffile.TIFF.DECOMPRESSORS, 3 in tifffile.TIFF.PREDICTORS)"
# tin_engine.io.geotiff runs that probe before decoding and refuses with a
# message naming the tag, the scheme and this extra (increment 11, §8).
codecs = ["imagecodecs>=2024.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
rasputin = "tin_engine.cli:app"

[project.urls]
Homepage = "https://github.com/expertanalytics/rasputin"
Issues = "https://github.com/expertanalytics/rasputin/issues"

# scikit-build-core drives the existing CMakeLists.txt. Hatchling cannot build
# C extensions, and the C++ core is already CMake-based, so the build backend
# follows the C++ rather than the other way round.
[tool.scikit-build]
minimum-version = "0.9"
build-dir = "build/{wheel_tag}"
# Tests are off for the wheel build: they pull Catch2 via FetchContent, which
# has no business running during `pip install`.
cmake.args = ["-DRASPUTIN_BUILD_PYTHON=ON", "-DRASPUTIN_BUILD_TESTS=OFF"]
wheel.packages = ["src_python/tin_engine"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/python"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # testing.md is the authority on the number: line coverage >= 85% per
    # module, anything lower needs a justification in the PR. Enforced here
    # rather than asserted in prose, so the CI run is what decides.
    "--cov=tin_engine",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src_python", "tests/python"]
# The archived pre-migration tree is not maintained and not linted. Its 242
# findings would otherwise drown out real ones in the new code.
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src_python/tin_engine"]
plugins = ["pydantic.mypy"]
