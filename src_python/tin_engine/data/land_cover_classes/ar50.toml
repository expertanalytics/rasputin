# NIBIO's AR50 land-resource map, land type (arealtype). Codes: SOSI AR50
# 2022-05-23 (ar50.xsd); colours in the legend ar50. Positional accuracy:
# NIBIO's product sheet, "2 og dårligere". docs/increments/73-gml-vector-source.md, section 4.5.
# Splits: tree type (treslag) and vegetation cover (vegetasjonsdekke), codes from
# ar50.xsd; docs/increments/91-ar50-vegetation-cover.md, section 3.
name = "ar50"
attribute = "arealtype"
code_system = "AR50 arealtype code"
positional_accuracy_m = 2
notice = "Contains data under the Norwegian licence for Open Government Data (NLOD) distributed by NIBIO: AR50 land-resource map 1:50 000, re-encoded"
licence = "Norwegian licence for Open Government Data (NLOD) 1.0, https://data.norge.no/nlod/en/1.0"
unlisted = "keep"
legend = "ar50"
# Class code 0: an area no polygon covers, kept for its constraint lines only.
accept_no_class = true

