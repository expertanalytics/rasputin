[[class]]
code = 5054
label = "Open firm ground, barren to good vegetation cover"
colour = "#e1c790"

[[class]]
code = 5055
label = "Open firm ground, good to lush non-continuous vegetation cover"
colour = "#c7a971"

[[class]]
code = 5099
