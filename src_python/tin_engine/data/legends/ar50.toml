[[class]]
code = 3099
label = "Forest, tree type not registered"
colour = "#9ecc73"

[[class]]
code = 5051
label = "Open firm ground, no vegetation"
colour = "#c0c0c0"

[[class]]
code = 5052
label = "Open firm ground, barren to non-continuous vegetation cover"
