# NIBIO's AR50 land-resource map, land type (arealtype) and its splits' sub-classes.
# Colours: NIBIO, Presentasjonsregler AR50, 12 June 2026, except 99, which NIBIO
# leaves unfilled, and forest 99, which takes forest's own; tables Treslag and
# Snaumark for the sub-classes.
name = "ar50"
preset = "rasputin AR50 NIBIO"

[no_class]
label = "No polygon; constraint lines"
colour = "#3c3c3c"

[[class]]
code = 10
label = "Developed area and traffic"
colour = "#e86474"

[[class]]
code = 20
label = "Agriculture"
colour = "#ffd16e"

[[class]]
code = 30
label = "Forest"
colour = "#9ecc73"

[[class]]
code = 50
label = "Open firm ground"
colour = "#d9d9d9"

[[class]]
code = 60
label = "Marsh"
colour = "#73dfff"

[[class]]
code = 70
label = "Snow and glacier"
colour = "#ffffff"

[[class]]
code = 81
label = "Freshwater"
colour = "#91e7ff"

[[class]]
code = 82
label = "Ocean"
colour = "#d2ffff"

[[class]]
code = 99
label = "Not surveyed"
colour = "#8c8c8c"

[[class]]
code = 3031
label = "Forest, coniferous: at least 50 % of the forested area covered by conifers"
colour = "#895944"

[[class]]
code = 3032
label = "Forest, deciduous: less than 20 % of the forested area covered by conifers"
colour = "#8b786f"

[[class]]
code = 3033
