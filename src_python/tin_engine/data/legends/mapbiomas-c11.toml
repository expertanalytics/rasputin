# MapBiomas Brazil, Collection 11: the official legend's codes, English labels
# and colours (legend_code_mapbiomas_brazil_collection_11.csv). Positional
# accuracy: its Landsat cell, 30 m (MapBiomas states none of its own).
name = "mapbiomas-c11"
attribute = "class"
code_system = "MapBiomas Collection 11 class"
positional_accuracy_m = 30
notice = "Contains data from the MapBiomas Project - Collection 11 of the Annual Series of Land Use and Land Cover Maps of Brazil (CC BY-SA 4.0)"
preset = "rasputin MapBiomas Collection 11"
unlisted = "land"

[edges]
water = ["land_cover", "water"]
land = ["land_cover"]

[no_class]
label = "No class; constraint lines"
colour = "#3c3c3c"

